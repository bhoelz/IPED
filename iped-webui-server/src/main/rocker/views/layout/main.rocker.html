@import java.util.List
@args (String title, List<String> styles, List<String> scripts, RockerBody content)
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@title</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@@400;500;600&family=IBM+Plex+Sans:wght@@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/workspace.css">
  <script src="/vendor/htmx.min.js" defer></script>
  <script>
    // Inject the XSRF-TOKEN cookie value as X-XSRF-TOKEN on every mutating HTMX request.
    // Required because CookieCsrfTokenRepository sets the token in a cookie but HTMX
    // does not read it automatically.
    document.addEventListener('htmx:configRequest', function (e) {
      var verb = (e.detail.verb || '').toLowerCase();
      if (verb === 'get') return;
      var match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
      if (match) e.detail.headers['X-XSRF-TOKEN'] = decodeURIComponent(match[1]);
    });
  </script>
@for (String href : styles) {
  <link rel="stylesheet" href="@href">
}
</head>
<body>
@content
@for (String src : scripts) {
  <script type="module" src="@src"></script>
}
</body>
</html>
