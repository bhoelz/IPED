@args (boolean error, boolean loggedOut)
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IPED — Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@@400;500&family=IBM+Plex+Sans:wght@@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    input { font: inherit; }

    :root {
      --bg:          oklch(0.18 0.015 250);
      --bg-2:        oklch(0.205 0.016 250);
      --surface:     oklch(0.235 0.017 250);
      --border:      oklch(0.32 0.018 250);
      --text:        oklch(0.93 0.008 250);
      --text-mute:   oklch(0.66 0.013 250);
      --text-dim:    oklch(0.5 0.013 250);
      --accent:      oklch(0.78 0.14 70);
      --ok:          oklch(0.75 0.13 150);
      --warn:        oklch(0.78 0.15 60);
      --bad:         oklch(0.7 0.17 25);
      --font-ui:   'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 32px 32px;
      width: 360px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #000;
      flex-shrink: 0;
    }
    .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-sub  { font-size: 11.5px; color: var(--text-mute); margin-top: 1px; }

    .alert {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      margin-bottom: 16px;
    }
    .alert-error {
      background: oklch(0.7 0.17 25 / 0.12);
      border: 1px solid oklch(0.7 0.17 25 / 0.35);
      color: var(--bad);
    }
    .alert-ok {
      background: oklch(0.75 0.13 150 / 0.1);
      border: 1px solid oklch(0.75 0.13 150 / 0.3);
      color: var(--ok);
    }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field-label { font-size: 11.5px; color: var(--text-mute); }
    .input {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      width: 100%;
      transition: border-color 0.12s;
    }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--text-dim); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      padding: 9px 0;
      border-radius: 6px;
      border: none;
      margin-top: 6px;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .btn-primary:hover { opacity: 0.85; }
  </style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="brand-mark">I</div>
    <div>
      <div class="brand-name">IPED</div>
      <div class="brand-sub">Investigation Platform</div>
    </div>
  </div>

  @if (error) {
  <div class="alert alert-error">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Invalid username or password.</span>
  </div>
  }
  @if (loggedOut) {
  <div class="alert alert-ok">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span>You have been signed out.</span>
  </div>
  }

  <form method="post" action="/login">
    <div class="field">
      <label class="field-label" for="username">Username</label>
      <input id="username" name="username" type="text" class="input"
             placeholder="analyst" autocomplete="username" autofocus required/>
    </div>
    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input id="password" name="password" type="password" class="input"
             placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn-primary">Sign in →</button>
  </form>

</div>
</body>
</html>
