###############################################################################
# Carver configuration — default signatures and processing rules
#
# Signature syntax (same as the legacy XML format):
#   ASCII chars written literally, e.g. "PK"
#   Hex-escaped bytes: \HH  e.g. \03\04
#   Single-byte wildcards: ?  (matches any byte)
#
# carverClass is optional; when absent the generic DefaultCarver is used.
# headers / footers / escapeFooters / lengthRefs are arrays of signatures.
# lengthOffset / lengthSizeBytes / lengthBigEndian drive size-from-header reads.
# stopOnNextHeader = true for formats whose end is the start of the next match.
###############################################################################

# When true, carved items that cannot be validated by their carver are silently
# discarded rather than raising an error.
ignoreCorrupted = true

# MIME types that are never submitted to carving, even if carving is enabled.
# Semi-colon-separated values were split into individual array entries here.
typesToNotProcess = [
    "application/x-raw-image",
    "application/x-ewf-image",
    "application/x-ewf2-image",
    "application/x-vmdk",
    "application/x-vmdk-data",
