###############################################################################
# Carver type definitions
# The carverClass field names the Java class that handles hit processing.
# If absent, iped.carvers.standard.DefaultCarver is used.
###############################################################################

[[carverType]]
name           = "SQLITE"
mediaType      = "application/x-sqlite3"
carverClass    = "iped.carvers.custom.SQLiteCarver"
minLength      = 10_000
maxLength      = 100_000_000

[[carverType]]
name           = "TOR_CIRCUIT_STATUS"
carverClass    = "iped.carvers.custom.TorTCCarver"
mediaType      = "application/x-tor-tc-fragment"
minLength      = 10
maxLength      = 1_000
headers        = ["BUILT", "EXTENDED"]
footers        = ["\\0d\\0a"]

[[carverType]]
name           = "OLE"
carverClass    = "iped.carvers.custom.OLECarver"
minLength      = 1_000
maxLength      = 50_000_000

[[carverType]]
name           = "ZIP"
carverClass    = "iped.carvers.custom.ZIPCarver"
minLength      = 1_000
maxLength      = 100_000_000
headers        = ["PK\\03\\04"]
footers        = ["PK\\05\\06??????????????????"]

[[carverType]]
name           = "MOV"
carverClass    = "iped.carvers.custom.MOVCarver"
minLength      = 100_000
maxLength      = 500_000_000

[[carverType]]
name           = "MATROSKA"
carverClass    = "iped.carvers.custom.MatroskaCarver"
mediaType      = "video/x-matroska"
minLength      = 40_000
maxLength      = 1_000_000_000
headers        = ["\\1a\\45\\df\\a3"]

[[carverType]]
name           = "OPUS"
carverClass    = "iped.carvers.custom.OpusCarver"
mediaType      = "audio/ogg"
minLength      = 1_000
maxLength      = 10_000_000
headers        = ["OggS\\00\\02"]

[[carverType]]
name           = "7ZIP"
carverClass    = "iped.carvers.custom.SevenZipCarver"
mediaType      = "application/x-7z-compressed"
minLength      = 1_000
maxLength      = 100_000_000
headers        = ["7z\\bc\\af\\27\\1c"]

[[carverType]]
name           = "CER"
mediaType      = "application/x-pem-file"
maxLength      = 30_000
headers        = ["-----BEGIN CERTIFICATE-----"]
footers        = ["-----END CERTIFICATE-----"]

[[carverType]]
name           = "EML"
carverClass    = "iped.carvers.custom.EMLCarver"
mediaType      = "message/rfc822"
minLength      = 1_000
maxLength      = 10_000_000
headers        = ["Received: by", "Received: from", "Message-ID:\\20<", "Return-Path:\\20"]
footers        = ["--\\0d\\0a"]

[[carverType]]
name           = "VCARD"
mediaType      = "text/x-vcard"
minLength      = 100
maxLength      = 100_000
headers        = ["begin:vcard", "BEGIN:VCARD"]
footers        = ["end:vcard", "END:VCARD"]

[[carverType]]
name              = "BMP"
mediaType         = "image/bmp"
minLength         = 1_000
maxLength         = 50_000_000
lengthOffset      = 2
lengthSizeBytes   = 4
lengthBigEndian   = false
headers           = [
    "BM????????????????????????\\01\\00\\01\\00",
    "BM????????????????????????\\01\\00\\04\\00",
    "BM????????????????????????\\01\\00\\08\\00",
    "BM????????????????????????\\01\\00\\10\\00",
    "BM????????????????????????\\01\\00\\18\\00",
    "BM????????????????????????\\01\\00\\20\\00"
]

[[carverType]]
name           = "JPG"
mediaType      = "image/jpeg"
minLength      = 1_000
maxLength      = 20_000_000
headers        = ["\\ff\\d8\\ff\\DB", "\\ff\\d8\\ff\\E0", "\\ff\\d8\\ff\\EE", "\\ff\\d8\\ff\\E1", "\\ff\\d8\\ff\\FE"]
footers        = ["\\ff\\d9"]
escapeFooters  = ["\\ff\\ff\\d9"]

[[carverType]]
name              = "EMF"
mediaType         = "image/emf"
minLength         = 1_000
maxLength         = 50_000_000
lengthOffset      = 48
lengthSizeBytes   = 4
lengthBigEndian   = false
headers           = ["\\01\\00\\00\\00???????????????????????????????????? EMF"]

[[carverType]]
name           = "PNG"
mediaType      = "image/png"
minLength      = 1_000
maxLength      = 20_000_000
headers        = ["\\89PNG\\0d\\0a\\1a\\0a"]
footers        = ["\\49END\\AE\\42\\60\\82"]

[[carverType]]
name           = "GIF"
mediaType      = "image/gif"
minLength      = 1_000
maxLength      = 10_000_000
headers        = ["GIF87a", "GIF89a"]
footers        = ["\\00\\3b"]

[[carverType]]
name           = "RAR"
mediaType      = "application/x-rar-compressed"
minLength      = 1_000
maxLength      = 100_000_000
headers        = ["\\52\\61\\72\\21\\1a\\07"]
footers        = ["\\c4\\3d\\7b\\00\\40\\07\\00"]

[[carverType]]
name           = "PDF"
carverClass    = "iped.carvers.custom.PDFCarver"
mediaType      = "application/pdf"
minLength      = 1_000
maxLength      = 50_000_000
headers        = ["%PDF-1", "%PDF-2"]
footers        = ["\\0a%%EOF\\0d\\0a", "\\0d%%EOF\\0d", "\\0a%%EOF\\0a", "\\0a%%EOF"]

[[carverType]]
name           = "HTM"
mediaType      = "text/html"
minLength      = 1_000
maxLength      = 10_000_000
headers        = ["<html", "<HTML"]
footers        = ["</html>", "</HTML>"]

[[carverType]]
name              = "INDEX.DAT"
mediaType         = "application/x-msie-cache"
minLength         = 1_000
maxLength         = 10_000_000
lengthOffset      = 28
lengthSizeBytes   = 4
lengthBigEndian   = false
headers           = ["Client UrlCache MMF Ver 4", "Client UrlCache MMF Ver 5"]

[[carverType]]
name           = "ARES"
mediaType      = "application/x-ares-galaxy"
minLength      = 1_000
maxLength      = 1_000_000
headers        = ["__ARESDB1.02H_", "__ARESDB1.04L_"]

[[carverType]]
name              = "SD"
mediaType         = "application/x-shareaza-download"
minLength         = 128
maxLength         = 65_536
stopOnNextHeader  = true
headers           = ["SDL?\\00\\00\\00\\FF"]

[[carverType]]
name           = "TORRENT"
carverClass    = "iped.carvers.custom.TorrentCarver"
mediaType      = "application/x-bittorrent"
minLength      = 128
maxLength      = 262_144
headers        = ["d8:announce", "d4:info", "d10:created by", "d8:encoding"]

[[carverType]]
name           = "RESUME.DAT"
carverClass    = "iped.carvers.custom.ResumeDatCarver"
mediaType      = "application/x-bittorrent-resume-dat"
minLength      = 1_024
maxLength      = 104_857_600
headers        = ["d10:.fileguard"]

[[carverType]]
name              = "RESUME.DAT ENTRY"
carverClass       = "iped.carvers.custom.ResumeDatEntryCarver"
mediaType         = "application/x-bittorrent-resume-dat-entry"
