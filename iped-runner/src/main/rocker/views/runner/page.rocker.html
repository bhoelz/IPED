@args (boolean dev)
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPED Runner — Processing Config</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@@400;500;600;700&family=IBM+Plex+Mono:wght@@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/runner/runner.css" />
<script src="/vendor/htmx.min.js" defer></script>
</head>
<body>
<div id="root"></div>

@if(dev) {
<!--
  Dev mode: React + Babel standalone from CDN; each JS file served individually
  with type="text/babel" so JSX is compiled in the browser at load time.
  Start with: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Drunner.dev=true"
-->
<script src="https://unpkg.com/react@@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@@babel/standalone@@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>

<!-- Load order matters: tweaks → icons → i18n → ui atoms → command/data → screens → app shell -->
<script type="text/babel" src="/runner/tweaks-panel.js"></script>
<script type="text/babel" src="/runner/icons.js"></script>
<script type="text/babel" src="/runner/i18n.js"></script>
<script type="text/babel" src="/runner/ui.js"></script>
<script type="text/babel" src="/runner/command.js"></script>
<script type="text/babel" src="/runner/screens.js"></script>
<script type="text/babel" src="/runner/app.js"></script>
} else {
<!--
  Prod mode: single Vite-compiled island bundle (React bundled in, no CDN deps).
  Built by: cd iped-runner-ui && npm run build
  Or via Maven: mvn generate-resources -pl iped-runner
-->
<script type="module" src="/runner/dist/runner-island.js"></script>
}
</body>
</html>
