server:
  port: 8092

spring:
  application:
    name: iped-runner

logging:
  level:
    iped.runner: INFO

runner:
  # Path (or command) used to launch IPED.  Split on whitespace by ExecutionService so
  # multi-word forms like "java -jar /opt/iped/iped-app.jar" work without shell escaping.
  executable: iped

  # Set to true to serve each JS file via Babel CDN (no Vite build step needed).
  # Launch with: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Drunner.dev=true"
  dev: false

  kafka:
    # Kafka bootstrap servers (host:port[,host:port...]) of the distributed processing
    # cluster. When set, the dashboard also shows cases from the global iped.status
    # topic. Leave empty to disable the distributed monitor.
    bootstrap-servers: ""
