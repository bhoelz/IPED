<style>
:root {
  --bg:           oklch(0.18 0.015 250);
  --bg-2:         oklch(0.205 0.016 250);
  --surface:      oklch(0.235 0.017 250);
  --surface-2:    oklch(0.265 0.017 250);
  --surface-hi:   oklch(0.305 0.018 250);
  --border:       oklch(0.32 0.018 250);
  --border-hi:    oklch(0.42 0.02 250);
  --text:         oklch(0.93 0.008 250);
  --text-mute:    oklch(0.66 0.013 250);
  --text-dim:     oklch(0.5 0.013 250);
  --accent:       oklch(0.78 0.14 70);
  --accent-soft:  oklch(0.78 0.14 70 / 0.18);
  --ok:           oklch(0.75 0.13 150);
  --warn:         oklch(0.78 0.15 60);
  --bad:          oklch(0.7  0.17 25);
  --font-ui:      "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --fs-sm:   11.5px;
  --fs-base: 12.5px;
  --topbar-h:    46px;
  --statusbar-h: 26px;
}
:root.light {
  --bg:         oklch(0.985 0.005 250);
  --bg-2:       oklch(0.965 0.006 250);
  --surface:    oklch(1.0 0 0);
  --surface-2:  oklch(0.975 0.005 250);
  --surface-hi: oklch(0.94 0.006 250);
  --border:     oklch(0.88 0.008 250);
  --border-hi:  oklch(0.78 0.012 250);
  --text:       oklch(0.22 0.014 250);
  --text-mute:  oklch(0.45 0.012 250);
  --text-dim:   oklch(0.6  0.01 250);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-ui); font-size: var(--fs-base);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01","cv05","tnum";
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-hi); border: 2px solid var(--bg); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

.shell { display: flex; flex-direction: column; height: 100vh; min-width: 1100px; }
.topbar {
  height: var(--topbar-h); flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-2); border-bottom: 1px solid var(--border); padding: 0 14px;
}
.brand-mark {
  width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent) 0%, oklch(0.6 0.15 35) 100%);
  display: grid; place-items: center;
  color: #1a1404; font-weight: 700; font-size: 12px; font-family: var(--font-mono);
}
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.55 0.12 200), oklch(0.55 0.12 280));
  color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600;
}
.vsep { width: 1px; height: 14px; background: var(--border); display: inline-block; flex-shrink: 0; }
.statusbar {
  height: var(--statusbar-h); flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-2); border-top: 1px solid var(--border);
  padding: 0 12px; font-size: 11px; color: var(--text-mute); font-family: var(--font-mono);
}
.scroll-area { flex: 1; overflow-y: auto; padding: 16px 18px 32px; }
.job-card {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; transition: border-color 0.15s, box-shadow 0.2s;
}
.job-card:hover { border-color: var(--border-hi); }
.job-card.open  { border-color: var(--border-hi); box-shadow: 0 4px 24px oklch(0 0 0 / 0.28); }
.job-row {
  display: grid; grid-template-columns: 1fr 108px 240px 110px 130px auto;
  align-items: center; gap: 16px; padding: 13px 16px; cursor: pointer;
}
.job-row:hover .view-btn { border-color: var(--border-hi); }
.panel-h {
  display: flex; align-items: center; height: 32px; padding: 0 12px;
  background: var(--surface); border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border); gap: 0; flex-shrink: 0;
}
.tab {
  padding: 0 14px; height: 31px; display: inline-flex; align-items: center;
  color: var(--text-mute); font-size: var(--fs-base);
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.sec-lbl {
  font-size: 10.5px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 9px;
}
.stat-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--border); }
.stat-cell  { background: var(--surface); padding: 10px 16px; }
.stat-cell .v { font-family: var(--font-mono); font-size: 15px; font-weight: 600; line-height: 1.1; }
.stat-cell .l { font-size: 10px; color: var(--text-dim); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
.dtbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.dtbl thead th {
  padding: 3px 0; font-size: 10.5px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border); font-weight: 500; text-align: left;
}
.dtbl tbody tr { border-bottom: 1px solid color-mix(in oklch, var(--border) 45%, transparent); }
.dtbl tbody tr:hover { background: var(--surface); }
.dtbl tbody td { padding: 4px 0; vertical-align: middle; }
.ibar      { flex: 1; height: 5px; background: var(--surface-hi); border-radius: 2px; overflow: hidden; min-width: 60px; }
.ibar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 3px; font-family: var(--font-mono);
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok) 55%, transparent); }
  70%  { box-shadow: 0 0 0 6px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.pulse-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); animation: pulse 2s infinite;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.slide-in { animation: slideIn 0.18s ease; }
.view-btn {
  padding: 5px 13px; border-radius: 3px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-mute); font-size: 11.5px;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.1s, color 0.1s, border-color 0.1s; white-space: nowrap;
}
.view-btn.active { background: var(--surface-hi); color: var(--accent); border-color: var(--accent); }

const __TW_CSS = `

  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;

    background:transparent;color:inherit;font:inherit;font-weight:500;
    min-height:22px;border-radius:6px;cursor:pointer;padding:4px 6px}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:pointer;padding:0}

  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;

    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85)}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((k, v) => {
    setValues(prev => ({ ...prev, [k]: v }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const onDragStart = e => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startR = window.innerWidth - r.right, startB = window.innerHeight - r.bottom;
    const move = ev => {
      offsetRef.current = { x: startR-(ev.clientX-sx), y: startB-(ev.clientY-sy) };
      panel.style.right = Math.max(16, offsetRef.current.x)+'px';
      panel.style.bottom = Math.max(16, offsetRef.current.y)+'px';
    };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TW_CSS}</style>
      <div ref={dragRef} className="twk-panel" style={{right:16, bottom:16}}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={()=>setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{
          left:`calc(2px + ${idx} * (100% - 4px) / ${n})`,
          width:`calc((100% - 4px) / ${n})`
        }}/>
        {opts.map(o => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value===value}
                  onClick={()=>onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value?'1':'0'}
              role="switch" aria-checked={!!value}
              onClick={()=>onChange(!value)}><i/></button>
    </div>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const cur = (value||'').toLowerCase();
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-chips">
        {(options||[]).map((c,i) => {
          const on = c.toLowerCase() === cur;
          return (
            <button key={i} type="button" className="twk-chip"
                    data-on={on?'1':'0'} style={{background:c}}
                    onClick={()=>onChange(c)}>
              {on && <svg viewBox="0 0 14 14"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke="#fff"/></svg>}
            </button>
          );
        })}
      </div>
    </div>
  );
}
</script>

const fmtN  = n  => (n||0).toLocaleString();
const fmtMB = mb => mb >= 1024 ? (mb/1024).toFixed(1)+" GB" : mb+" MB";

function svgPt(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function donutArc(cx, cy, ro, ri, a0, a1) {
  if (a1 - a0 >= 360) a1 = a0 + 359.99;
  const os = svgPt(cx,cy,ro,a0), oe = svgPt(cx,cy,ro,a1);
  const is = svgPt(cx,cy,ri,a1), ie = svgPt(cx,cy,ri,a0);
  const lg = (a1-a0) > 180 ? 1 : 0;
  return `M${os.x} ${os.y} A${ro} ${ro} 0 ${lg} 1 ${oe.x} ${oe.y} L${is.x} ${is.y} A${ri} ${ri} 0 ${lg} 0 ${ie.x} ${ie.y}Z`;
}

function DonutChart({ data, size = 168 }) {
  const cx = size/2, cy = size/2, ro = size*0.42, ri = size*0.265;
  const items = data.filter(d => (d.pct||0) > 0);
  if (!items.length) return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{display:"block"}}>
      <circle cx={cx} cy={cy} r={ro} fill="none" stroke="var(--surface-hi)" strokeWidth={ro-ri}/>
      <text x={cx} y={cy+4} textAnchor="middle" fill="var(--text-dim)" fontSize="11" fontFamily="var(--font-ui)">No data</text>
    </svg>
  );
  const total = items.reduce((s,d) => s+(d.pct||0), 0)||1;
  const GAP = items.length > 1 ? 2.5 : 0;
  let cur = -90;
  const paths = items.map((d,i) => {
    const sweep = (d.pct/total)*(360 - GAP*items.length);
    const p = donutArc(cx, cy, ro, ri, cur, cur+sweep);
    cur += sweep + GAP;
    return { path:p, color:CC[i%CC.length], name:d.name, pct:d.pct };
  });
  const top = paths.reduce((a,b) => b.pct>a.pct?b:a, paths[0]);
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{display:"block"}}>
      {paths.map((p,i) => <path key={i} d={p.path} fill={p.color} opacity={0.9}/>)}
      <text x={cx} y={cy-4} textAnchor="middle" fill="var(--text)"
            fontSize={size*0.115} fontFamily="var(--font-mono)" fontWeight="600">{top.pct}%</text>
      <text x={cx} y={cy+14} textAnchor="middle" fill="var(--text-dim)"
            fontSize={size*0.063} fontFamily="var(--font-ui)">{top.name}</text>
    </svg>
  );
}

function ProgressRing({ pct, size=44, color="var(--ok)" }) {
  const r = (size-5)/2, circ = 2*Math.PI*r;
  const dash = (Math.min(pct,100)/100)*circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block",flexShrink:0}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface-hi)" strokeWidth="3.5"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="3.5"
              strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
              transform={`rotate(-90 ${size/2} ${size/2})`}
              style={{transition:"stroke-dasharray 0.9s ease"}}/>
      <text x={size/2} y={size/2+4} textAnchor="middle" fill="var(--text)"
            fontSize="10" fontFamily="var(--font-mono)" fontWeight="600">{pct}%</text>
    </svg>
  );
}

function StatusPill({ status }) {
  const S = {
    running:{ bg:"oklch(0.35 0.10 150/0.35)", c:"var(--ok)",            dot:true,  lbl:"Running"  },
    done:   { bg:"oklch(0.30 0.07 150/0.28)", c:"oklch(0.72 0.13 150)", dot:false, lbl:"Complete" },
    queued: { bg:"oklch(0.28 0.04 250/0.30)", c:"var(--text-dim)",       dot:false, lbl:"Queued"   },
    paused: { bg:"oklch(0.35 0.12 60/0.30)",  c:"var(--warn)",           dot:false, lbl:"Paused"   },
    error:  { bg:"oklch(0.35 0.14 25/0.30)",  c:"var(--bad)",            dot:false, lbl:"Error"    },
  };
  const s = S[status] || S.queued;
  return (
    <span className="status-pill" style={{background:s.bg, color:s.c}}>
      {s.dot && <span className="pulse-dot"/>}
      {s.lbl}
    </span>
  );
}

function DistTab({ items, singular }) {
  const maxPct = Math.max(...items.map(t=>t.pct), 1);
  if (!items.length) return <div style={{color:"var(--text-dim)",fontSize:12,padding:"24px 0",textAlign:"center"}}>No data available.</div>;
  return (
    <div style={{display:"grid", gridTemplateColumns:"1fr 280px", gap:28, alignItems:"start"}}>
      <div>
        <div className="sec-lbl">{singular} Times</div>
        <table className="dtbl">
          <thead>
            <tr>
              <th>{singular}</th>
              <th style={{width:50,textAlign:"right"}}>Time</th>
              <th style={{width:180,paddingLeft:10}}>Distribution</th>
              <th style={{width:40,textAlign:"right"}}>%</th>
            </tr>
          </thead>
          <tbody>
            {items.map((t,i) => {
              const isTop = t.pct === maxPct;
              return (
                <tr key={t.name} style={{background:isTop?"color-mix(in oklch, var(--accent) 6%, transparent)":""}}>
                  <td style={{color:isTop?"var(--accent)":"var(--text)", fontWeight:isTop?500:400, paddingRight:8}}>{t.name}</td>
                  <td style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-mute)",textAlign:"right"}}>{t.secs}s</td>
                  <td style={{paddingLeft:10,paddingRight:8}}>
                    <div className="ibar"><div className="ibar-fill" style={{width:`${(t.pct/maxPct)*100}%`,background:CC[i%CC.length]}}/></div>
                  </td>
                  <td style={{fontFamily:"var(--font-mono)",fontSize:11,color:isTop?"var(--accent)":"var(--text-dim)",textAlign:"right"}}>{t.pct}%</td>
                </tr>

          </tbody>
        </table>
      </div>
      <div>
        <div className="sec-lbl">By percentage</div>
        <DonutChart data={items} size={168}/>
        <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:10}}>
          {items.slice(0,6).map((t,i) => (
            <div key={t.name} style={{display:"flex",alignItems:"center",gap:7}}>
              <div style={{width:7,height:7,borderRadius:1,background:CC[i%CC.length],flexShrink:0}}/>
              <span style={{fontSize:10.5,fontFamily:"var(--font-mono)",color:"var(--text-mute)",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</span>

  );
}

function WorkersTab({ job }) {
  if (!job.workers.length) return (
    <div style={{textAlign:"center",padding:"32px 0",color:"var(--text-dim)",fontSize:12}}>
      No active workers — processing complete.
    </div>
  );
  const taskSet = [...new Set(job.workers.map(w=>w.task))];
  const taskColor = Object.fromEntries(taskSet.map((t,i)=>[t,CC[i%CC.length]]));
  return (
    <div>
      <div className="sec-lbl">Active Workers · {job.workers.length} threads</div>
      <table className="dtbl">
        <thead><tr>
          <th style={{width:76}}>Worker</th>
          <th style={{width:150}}>Task</th>
          <th>Current Item</th>
        </tr></thead>
        <tbody>
          {job.workers.map(w => (
            <tr key={w.id}>
              <td style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-dim)"}}>Worker-{w.id}</td>
              <td><span style={{fontFamily:"var(--font-mono)",fontSize:11,color:taskColor[w.task]||"var(--accent)"}}>{w.task}</span></td>
              <td style={{fontFamily:"var(--font-mono)",fontSize:10.5,color:"var(--text-mute)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:500}}>{w.file}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function DetailPanel({ job }) {
  const [tab, setTab] = useState("overview");
  const pct = job.itemsFound > 0 ? Math.round((job.itemsProcessed/job.itemsFound)*100) : (job.status==="done"?100:0);
  const TABS = [["overview","Overview"],["tasks","Tasks"],["parsers","Parsers"],[`workers`,`Workers (${job.workers.length})`]];
  return (
    <div className="slide-in">
      <div className="stat-strip">
        {[
          [fmtN(job.itemsProcessed)+" / "+fmtN(job.itemsFound), "Items Processed", pct>0?"var(--ok)":"var(--text-dim)"],
          [job.procTime, "Processing Time", "var(--text)"],
          [job.curSpeed, "Current Speed", "var(--accent)"],
          [job.parseErr>0?job.parseErr+" errors":"No errors","Parse Errors",job.parseErr>0?"var(--warn)":"var(--ok)"],
        ].map(([val,lbl,c])=>(
          <div key={lbl} className="stat-cell">
            <div className="v" style={{color:c}}>{val}</div>
            <div className="l">{lbl}</div>
          </div>
        ))}
      </div>
      <div className="panel-h">
        {TABS.map(([k,l])=>(
          <div key={k} className={"tab"+(tab===k?" active":"")} onClick={()=>setTab(k)}>{l}</div>
        ))}
        <div style={{flex:1}}/>
        <span style={{fontFamily:"var(--font-mono)",fontSize:10.5,color:"var(--text-dim)",paddingRight:2}}>{job.id} · {job.caseId}</span>
      </div>
      <div style={{padding:18,background:"var(--bg)",overflowX:"auto",minWidth:0}}>
        {tab==="overview" && <OverviewTab job={job}/>}
        {tab==="tasks"    && <DistTab items={job.tasks.filter(t=>(t.pct||0)>0||(t.secs||0)>0)} singular="Task"/>}
        {tab==="parsers"  && <DistTab items={job.parsers.filter(p=>(p.pct||0)>0||(p.secs||0)>0)} singular="Parser"/>}
        {tab==="workers"  && <WorkersTab job={job}/>}
      </div>
    </div>
  );
}

function JobRow({ job }) {
  const [open, setOpen] = useState(false);
  const toggle = ()=>setOpen(o=>!o);
  const pct = job.itemsFound>0?Math.round((job.itemsProcessed/job.itemsFound)*100):(job.status==="done"?100:0);
  const barColor = {running:"var(--ok)",done:"oklch(0.65 0.11 150)",queued:"var(--surface-hi)",paused:"var(--warn)",error:"var(--bad)"}[job.status]||"var(--accent)";
  return (
    <div className={"job-card"+(open?" open":"")}>
      <div className="job-row" onClick={toggle}>
        <div style={{display:"flex",alignItems:"center",gap:12,minWidth:0}}>
          <ProgressRing pct={pct} size={46} color={barColor}/>
          <div style={{minWidth:0}}>
            <div style={{fontWeight:600,fontSize:13.5,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{job.name}</div>
            <div style={{fontSize:10.5,fontFamily:"var(--font-mono)",color:"var(--text-dim)",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{job.source}</div>
          </div>
        </div>
        <div><StatusPill status={job.status}/></div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{fontSize:10.5,fontFamily:"var(--font-mono)",color:"var(--text-mute)"}}>{fmtN(job.itemsProcessed)} / {fmtN(job.itemsFound)}</span>
            <span style={{fontSize:10.5,fontFamily:"var(--font-mono)",color:barColor,fontWeight:600}}>{pct}%</span>
          </div>
          <div style={{height:5,background:"var(--surface-hi)",borderRadius:3,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:barColor,borderRadius:3,transition:"width 1s ease"}}/>
          </div>
        </div>
        <div>
          <div style={{fontSize:10,color:"var(--text-dim)",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.05em"}}>ETA</div>
          <div style={{fontSize:12,fontFamily:"var(--font-mono)",color:"var(--text-mute)"}}>{job.eta}</div>
        </div>
        <div>
          <div style={{fontSize:10,color:"var(--text-dim)",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.05em"}}>Speed</div>
          <div style={{fontSize:12,fontFamily:"var(--font-mono)",color:"var(--text-mute)"}}>{job.curSpeed}</div>
        </div>
        <div onClick={e=>e.stopPropagation()}>
          <button className={"view-btn"+(open?" active":"")} onClick={toggle}>
            {open ? "▲ Hide" : "▼ View Details"}
          </button>
        </div>
      </div>
      {open && <DetailPanel job={job}/>}
    </div>
  );
}

function PageHeader({ cases }) {
  const running=cases.filter(c=>c.status==="running").length;
  const done=cases.filter(c=>c.status==="done").length;
  const queued=cases.filter(c=>c.status==="queued").length;
  const total=cases.reduce((a,c)=>a+c.itemsProcessed,0);
  return (
    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14,flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontSize:17,fontWeight:700,letterSpacing:"-0.01em"}}>Processing Dashboard</div>

      </div>
      {[
        ["Running",running,"var(--ok)"],
        ["Complete",done,"oklch(0.65 0.11 150)"],
        ["Queued",queued,"var(--text-dim)"],
        ["Items Processed",fmtN(total),"var(--accent)"],
      ].map(([lbl,val,c])=>(
        <div key={lbl} style={{padding:"8px 16px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:4,textAlign:"center"}}>
          <div style={{fontSize:16,fontFamily:"var(--font-mono)",fontWeight:600,color:c}}>{val}</div>
          <div style={{fontSize:10,color:"var(--text-dim)",marginTop:2,textTransform:"uppercase",letterSpacing:"0.05em"}}>{lbl}</div>
        </div>
      ))}
      <button style={{padding:"8px 13px",borderRadius:3,background:"var(--surface)",border:"1px solid var(--border)",color:"var(--text-mute)",fontSize:12}}>+ New Job</button>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks({ theme:"dark", accent:"#e0a83a", liveUpdate:true });
  const [cases, setCases] = useState(BASE_CASES);
  const [clock, setClock] = useState(()=>new Date().toLocaleTimeString());

  useEffect(()=>{
    document.documentElement.classList.toggle("light", t.theme==="light");
    document.documentElement.style.setProperty("--accent", t.accent);
    document.documentElement.style.setProperty("--accent-soft", t.accent+"30");
  }, [t.theme, t.accent]);

  useEffect(()=>{
    const id=setInterval(()=>setClock(new Date().toLocaleTimeString()),1000);
    return ()=>clearInterval(id);
  },[]);

  useEffect(()=>{
    if(!t.liveUpdate) return;
    const id=setInterval(()=>{
      setCases(prev=>prev.map(c=>{
        if(c.status!=="running") return c;
        const inc=Math.floor(Math.random()*110+40);
        const newProc=Math.min(c.itemsFound,c.itemsProcessed+inc);
        return {...c, itemsProcessed:newProc, status:newProc>=c.itemsFound?"done":"running"};
      }));
    },1600);
    return ()=>clearInterval(id);
  },[t.liveUpdate]);

  const runningCount=cases.filter(c=>c.status==="running").length;

  return (
    <div className="shell">
      <header className="topbar">
        <div className="brand-mark">A</div>
        <div style={{lineHeight:1.15}}>
          <div style={{fontWeight:600,fontSize:13,letterSpacing:"0.01em"}}>ACE Framework</div>
          <div style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--text-mute)"}}>Processing Monitor</div>
        </div>
        <span className="vsep"/>
        <span style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--text-mute)"}}>IPED v4 · Processing Dashboard</span>
        <div style={{flex:1}}/>
        {runningCount>0&&(
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,fontFamily:"var(--font-mono)",color:"var(--text-mute)"}}>
            <span className="pulse-dot"/>
            <span style={{color:"var(--ok)"}}>{runningCount} job{runningCount>1?"s":""} running</span>
          </div>
        )}
        <span className="vsep"/>
        <div className="avatar">JS</div>
      </header>

      <div className="scroll-area">
        <PageHeader cases={cases}/>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {cases.map(c=><JobRow key={c.id} job={c}/>)}
        </div>
      </div>

      <footer className="statusbar">
        <span>IPED v4.4.0</span>
        <span className="vsep"/>
        <span>{cases.filter(c=>c.status==="running").length} indexing · {cases.filter(c=>c.status==="done").length} complete · {cases.filter(c=>c.status==="queued").length} queued</span>
        <div style={{flex:1}}/>
        <span>{clock}</span>
      </footer>

      <TweaksPanel title="Processing Dashboard — Tweaks">
        <TweakSection label="Appearance"/>
        <TweakRadio label="Theme" value={t.theme} onChange={v=>setTweak("theme",v)}
          options={[{value:"dark",label:"Dark"},{value:"light",label:"Light"}]}/>
        <TweakColor label="Accent" value={t.accent} onChange={v=>setTweak("accent",v)}
          options={["#e0a83a","#3f86e0","#34a86a","#c84563","#9266dd"]}/>
        <TweakSection label="Dashboard"/>
        <TweakToggle label="Live updates" value={t.liveUpdate} onChange={v=>setTweak("liveUpdate",v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
