<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>NOMBRE DE LA ORGANIZACIÓN</title>
        <link rel="stylesheet" type="text/css" href="res/estilo.css" />
        <link rel="stylesheet" type="text/css" href="res/info.css" />
    </head>
    <body>
        <div id="conteudo">
            <table class="info">
                <tr>
                    <td style="vertical-align:middle; text-align:center" class="SmallText3" colspan="2"><b>%HEADER%</b><br /></td>
                </tr>
                <tr><td style="width:1%" class="SmallText3"><b>Informe</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText"><b>%REPORT%</b></td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Fecha</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%REPORT_DATE%</td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Título</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%TITLE%</td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Examinador(s)</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EXAMINERS%
                    </td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Referencias</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        <b>%INVESTIGATION%</b><br>
                        %REQUEST_DOC% el %REQUEST_DATE%<br>
                        Solicitado por %REQUESTER%<br>
                        Caso de Laboratorio %RECORD% el %RECORD_DATE%<br>
                    </td></tr>

                <tr>
                    <td style="width:1%" class="SmallText3"><b>Evidencia Analizada</b></td>
                    <td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EVIDENCE%
                    </td>
                </tr>

            </table>
        </div>
    </body>
</html>
