<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>ORGANIZATION NAME</title>
        <link rel="stylesheet" type="text/css" href="res/estilo.css" />
        <link rel="stylesheet" type="text/css" href="res/info.css" />
    </head>
    <body>
        <div id="conteudo">
            <table class="info">
                <tr>
                    <td style="vertical-align:middle; text-align:center" class="SmallText3" colspan="2"><b>%HEADER%</b><br /></td>
                </tr>
                <tr><td style="width:1%" class="SmallText3"><b>Report</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText"><b>%REPORT%</b></td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Date</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%REPORT_DATE%</td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Title</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%TITLE%</td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Examiner(s)</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EXAMINERS%
                    </td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>References</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        <b>%INVESTIGATION%</b><br>
                        %REQUEST_DOC% at %REQUEST_DATE%<br>
                        Requested by %REQUESTER%<br>
                        Laboratory Case %RECORD% at %RECORD_DATE%<br>
                    </td></tr>

                <tr>
                    <td style="width:1%" class="SmallText3"><b>Analyzed Evidence</b></td>
                    <td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EVIDENCE%
                    </td>
                </tr>

            </table>
        </div>
    </body>
</html>
