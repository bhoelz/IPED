<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <title>Pol&iacute;cia Federal</title>
        <link rel="stylesheet" type="text/css" href="res/estilo.css" />
        <link rel="stylesheet" type="text/css" href="res/info.css" />
    </head>
    <body>
        <div id="conteudo">
            <table class="info">
                <tr>
                    <td style="vertical-align:middle; text-align:center" class="SmallText3" colspan="2"><img src="res/armas.gif" /><br />
                        <b>%HEADER%</b>
                    </td>
                </tr>
                <tr><td style="width:1%" class="SmallText3"><b>Laudo</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText"><b>%REPORT%</b> de %REPORT_DATE%</td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Título</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%TITLE%</td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Signatário(s)</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EXAMINERS%
                    </td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Referências</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        <b>%INVESTIGATION%</b><br>
                        %REQUEST_DOC% de %REQUEST_DATE%<br>
                        Solicitação %REQUESTER%<br>
                        Protocolo Criminalística nº %RECORD% de %RECORD_DATE%<br>
                    </td></tr>

                <tr>
                    <td style="width:1%" class="SmallText3"><b>Material examinado</b></td>
                    <td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EVIDENCE%
                    </td>
                </tr>

            </table>
        </div>
    </body>
</html>
