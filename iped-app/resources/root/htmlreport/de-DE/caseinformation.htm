<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <title>Bezeichnung der Organisation</title>
        <link rel="stylesheet" type="text/css" href="res/estilo.css" />
        <link rel="stylesheet" type="text/css" href="res/info.css" />
    </head>
    <body>
        <div id="conteudo">
            <table class="info">
                <tr>
                    <td style="vertical-align:middle; text-align:center" class="SmallText3" colspan="2"><b>%HEADER%</b><br /></td>
                </tr>
                <tr><td style="width:1%" class="SmallText3"><b>Bericht</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText"><b>%REPORT%</b></td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Datum</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%REPORT_DATE%</td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Titel</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%TITLE%</td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Ermittler</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EXAMINERS%
                    </td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Vorgangsreferenz</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        <b>%INVESTIGATION%</b><br>
                        %REQUEST_DOC% vom %REQUEST_DATE%<br>
                        angefordert von %REQUESTER%<br>
                        Fallnummer des Labors %RECORD% vom %RECORD_DATE%<br>
                    </td></tr>

                <tr>
                    <td style="width:1%" class="SmallText3"><b>Analysierte Beweise</b></td>
                    <td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EVIDENCE%
                    </td>
                </tr>

            </table>
        </div>
    </body>
</html>
