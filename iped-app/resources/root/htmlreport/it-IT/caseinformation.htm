<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <title>NOME DELL'ORGANIZZAZIONE</title>
        <link rel="stylesheet" type="text/css" href="res/estilo.css" />
        <link rel="stylesheet" type="text/css" href="res/info.css" />
    </head>
    <body>
        <div id="conteudo">
            <table class="info">
                <tr>
                    <td style="vertical-align:middle; text-align:center" class="SmallText3" colspan="2"><b>%HEADER%</b><br /></td>
                </tr>
                <tr><td style="width:1%" class="SmallText3"><b>Rapporto</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText"><b>%REPORT%</b></td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Data</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%REPORT_DATE%</td></tr>
                <tr><td style="width:1%" class="SmallText3"><b>Titolo</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">%TITLE%</td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Esaminatore(i)</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EXAMINERS%
                    </td></tr>

                <tr><td style="width:1%" class="SmallText3"><b>Riferimento</b></td><td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        <b>%INVESTIGATION%</b><br>
                        %REQUEST_DOC% del %REQUEST_DATE%<br>
                        Richiesto da %REQUESTER%<br>
                        Numero di caso del laboratorio %RECORD% del %RECORD_DATE%<br>
                    </td></tr>

                <tr>
                    <td style="width:1%" class="SmallText3"><b>Reperto Analizzato</b></td>
                    <td style="text-align:left; vertical-align:middle" class="MainBodyText">
                        %EVIDENCE%
                    </td>
                </tr>

            </table>
        </div>
    </body>
</html>
