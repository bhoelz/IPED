# ########################################################################
# Local environment configuration (TOML)
#
# IPED ships safe defaults inside its own jars, so this file only needs
# to contain settings that DIFFER from the defaults on this machine.
# Uncomment and edit just what you want to change.
# ########################################################################

# Program localization/language: "en", "pt-BR", "it-IT", "de-DE", "es-AR" or "fr-FR".
#locale = "en"

# Temporary directory for processing: "default" uses the system temporary folder.
# Configure it on a folder free of antivirus, system indexing or restoring. SSD highly recommended.
#indexTemp = "default"

# Enable if indexTemp is on a SSD disk.
#indexTempOnSSD = false

# Enable if output/case folder is on SSD. If enabled, index is created directly in case folder.
#outputOnSSD = true

# Number of processing threads/workers: "default" uses the number of CPU logical cores.
#numThreads = "default"

# Full path for IPED hash database.
#hashesDB = "C:/IPED/iped-hashes.db"

# Full path for sleuthkit-4.x.x.jar built on Linux OS.
#tskJarPath = "/usr/local/share/java/sleuthkit-4.11.1.jar"

# Plugin folder for optional libs not embedded because of license restrictions.
#pluginFolder = "../plugins/"
