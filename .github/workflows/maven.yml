name: Java CI

on: [push]

jobs:

  build-java11:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11
        java-package: jdk+fx

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v4
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: | 
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |
          sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts


    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - shell: bash
      run:
        cd target && mv release iped-snapshot-$GITHUB_SHA && tar -zcvf ../iped-snapshot.tar.gz iped-snapshot-$GITHUB_SHA
    - name: Upload snapshot
      uses: actions/upload-artifact@v4
      with:
        name: iped-snapshot-${{ github.sha }}
        path: iped-snapshot.tar.gz

  build-java14:
    
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v1
    - run: curl -O "https://download.bell-sw.com/java/14.0.2+13/bellsoft-jdk14.0.2+13-linux-amd64-full.tar.gz"
    - name: Set up JDK 14
      uses: actions/setup-java@v1
      with:
        java-version: 14
        jdkFile: ./bellsoft-jdk14.0.2+13-linux-amd64-full.tar.gz

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v4
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: | 
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |        
          sudo add-apt-repository ppa:alex-p/tesseract-ocr-devel && sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts

    - name: Build with Maven
      run: mvn -B package --file pom.xml

  # ── JDK 25 gate for the web-services modules ──────────────────────────────
  # Verifies the modules that target JDK 25 (Spring Boot 4, MCP, Jersey API):
  #   iped-api, iped-utils, iped-engine-core, iped-webapi,
  #   iped-webui-server, iped-mcp, iped-runner.
  # Runs `mvn verify` (not just package) so all unit tests execute.
  # --also-make builds each module's in-reactor dependencies first.
  build-java25-webservices:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify web-services stack on JDK 25
      run: |
        mvn -B verify --no-transfer-progress \
          -pl iped-api,iped-utils,iped-engine-parent/iped-engine-core,iped-webapi,iped-webui-server,iped-mcp,iped-runner \
          --also-make \
          -Dwebui.skipFrontend=true

  # ── Angular island unit tests ─────────────────────────────────────────────
  # Runs Vitest (via ng test) for all six island component specs.
  # Vitest automatically uses --run (non-watch) mode when CI=true.
  build-angular-islands:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: iped-webui/package-lock.json

    - name: Install dependencies
      working-directory: iped-webui
      run: npm ci

    - name: TypeScript contract check
      working-directory: iped-webui
      run: npm run test:contract

    - name: Island unit tests
      working-directory: iped-webui
      run: npm test
