name: PR Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Full build + unit tests on JDK 25 ──────────────────────────────────────
  # Mirrors the external-tool setup from the legacy build-java11/14 jobs in
  # maven.yml, but on JDK 25 (the version the reactor now compiles/targets per
  # <maven.compiler.source>/<target> in pom.xml). Runs `verify` so unit tests
  # actually execute and fail the gate, not just `package`.
  build-and-test:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v4
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: |
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |
          sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts

    - name: Build and test with Maven
      run: mvn -B verify --no-transfer-progress --file pom.xml

    - name: Publish test report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Maven unit tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false

    - name: Coverage summary (JaCoCo)
      if: always()
      uses: madrapps/jacoco-report@v1.7.1
      with:
        paths: '**/target/site/jacoco/jacoco.xml'
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 0
        min-coverage-changed-files: 0
        continue-on-error: true

  # ── Static analysis (SpotBugs) ─────────────────────────────────────────────
  # PI-1-F1-S3 decision (documented per the story's own DoD, which explicitly
  # allows this outcome instead of forcing a premature flip): SpotBugs STAYS
  # `continue-on-error: true` (report-only) for this PI. Rationale: a scoped
  # baseline run against just `iped-distributed` + its `iped-engine`
  # dependency (not even the full ~90-module reactor) already surfaced 25+
  # Medium-severity findings (EI_EXPOSE_REP/REP2, CT_CONSTRUCTOR_THROW,
  # SF_SWITCH_NO_DEFAULT, NP_DEREFERENCE_OF_READLINE_VALUE, etc.) in
  # `iped-utils`/`iped-api` alone, before the scan of the full module set
  # even completed. Flipping `continue-on-error: false` today would fail
  # every PR's CI on pre-existing, untriaged debt unrelated to the PR's own
  # changes — exactly the outcome this story exists to avoid causing.
  # Triaging that full backlog (classify each finding as real debt vs.
  # accepted-risk/false-positive, build a suppression baseline analogous to
  # `iped-engine-parent/dependency-check-suppressions.xml` from PI-1-F1-S1)
  # is a multi-day effort out of this story's envelope. Decision: remain
  # informative in PI-1, reassess promotion to blocking in PI-2 once a
  # SpotBugs exclude-filter baseline exists. See `.claude/sdlc/DEPENDENCIES.md`
  # and `.claude/sdlc/VERIFICATION-BACKLOG.md` for tracking.
  spotbugs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run SpotBugs
      continue-on-error: true
      run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:check --no-transfer-progress -Dspotbugs.failOnError=false

    - name: Upload SpotBugs reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spotbugs-reports
        path: '**/target/spotbugsXml.xml'
        if-no-files-found: ignore

  # ── Dependency vulnerability scan ──────────────────────────────────────────
  # PI-1-F1-S1: tightened from CVSS>=9 to CVSS>=7 (fails on High + Critical,
  # not just Critical) now that a suppression file exists to triage accepted
  # risks/false positives. See iped-engine-parent/dependency-check-suppressions.xml
  # and .claude/sdlc/DEPENDENCIES.md for the baseline status/rationale — the
  # suppression file currently has ZERO triaged entries because a real scan
  # run (this job, with a valid NVD_API_KEY) has not executed yet; the first
  # CI run against this config is the actual baseline run, not this commit.
  dependency-check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: OWASP Dependency-Check
      run: |
        mvn -B org.owasp:dependency-check-maven:check --no-transfer-progress \
          -DfailBuildOnCVSS=7 \
          -DsuppressionFiles=iped-engine-parent/dependency-check-suppressions.xml \
          -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
          -Dformats=HTML,JSON

    - name: Upload dependency-check report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: '**/target/dependency-check-report.html'
        if-no-files-found: ignore

  # ── Secret scanning ─────────────────────────────────────────────────────
  gitleaks:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CodeQL analysis ─────────────────────────────────────────────────────
  codeql:

    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # ── PR metadata hygiene ─────────────────────────────────────────────────
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: codelytv/pr-size-labeler@v1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        xs_max_size: '10'
        s_max_size: '100'
        m_max_size: '500'
        l_max_size: '1000'
        fail_if_xl: 'false'
