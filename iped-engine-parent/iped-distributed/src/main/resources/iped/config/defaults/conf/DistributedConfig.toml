# IPED Distributed Processing Configuration
# Place this file in your IPED configuration directory to enable distributed mode.
#
# IMPORTANT: All datasource files (E01, AD1, UFDR, etc.) must be accessible at
# the SAME absolute path on every reader node and every task agent node.
# Use NFS, CIFS, or an S3-compatible mount (e.g. MinIO + s3fs) for this purpose.

# Master switch — set to 'true' to enable Kafka-based distributed processing.
# When false (default), IPED runs in the standard local pipeline mode.
enableDistributed = false

# Kafka broker list (comma-separated host:port pairs)
kafkaBootstrapServers = "localhost:9092"

# URL of the Coordinator Server (CoordinatorServer.main())
coordinatorServerUrl = "http://localhost:8484"

# Root of the shared storage mount point on THIS node.
# All datasource paths stored in Kafka messages are relative to this root.
sharedStorageRoot = "/mnt/iped-shared"

# Number of Kafka partitions per pipeline topic.
# Rule of thumb: set to (max expected concurrent agents for any task type) × 2
topicPartitions = 8

# Kafka replication factor for pipeline topics.
# Use 1 for development; 2 or 3 for production clusters.
topicReplicationFactor = 1

# Maximum number of items processed concurrently inside a single Task Agent process.
# This controls the internal Worker thread pool size.
agentParallelism = 4

# Seconds before an item/task combination is considered timed out.
# Adjust based on the slowest expected task (e.g. OCR on large PDFs).
itemTimeoutSeconds = 3600

# Suffix appended to the input topic name to form the dead-letter queue topic.
# Items that fail permanently are forwarded here for manual inspection.
deadLetterTopicSuffix = ".dlq"

# Failed attempts per stage before an item is sent to the DLQ (0 = no retries).
maxRetries = 3

# Base delay of the exponential retry backoff. The Nth retry waits
# retryBackoffBaseSeconds * 2^(N-1) seconds (30s, 60s, 120s, ... by default).
retryBackoffBaseSeconds = 30

# When true, uses Kafka transactions to provide exactly-once processing semantics.
# Prevents duplicate processing on agent restart at the cost of lower throughput.
exactlyOnce = false

# Port on which the Coordinator Server listens.
coordinatorPort = 8484

# Seconds between agent heartbeat calls to the coordinator.
heartbeatIntervalSeconds = 10

# Seconds without heartbeat after which an agent is considered dead and evicted.
agentExpirySeconds = 30
