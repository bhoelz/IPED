@if (loading()) {
  <div class="gr-state"><span class="gr-muted">Loading graph…</span></div>
} @else if (error()) {
  <div class="gr-state"><span class="gr-bad">{{ error() }}</span></div>
} @else if (empty()) {
  <div class="gr-state">
    <div class="gr-empty-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
        <circle cx="12" cy="18" r="2"/><path d="m8 6 8 0M7 8l4 8M17 8l-4 8"/>
      </svg>
    </div>
    <div class="gr-empty-label">No graph data</div>
  </div>
} @else {
  <canvas #canvas class="gr-canvas"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp($event)"
    (mouseleave)="onMouseLeave()">
  </canvas>
}
